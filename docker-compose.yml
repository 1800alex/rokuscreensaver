# Example deployment for the Roku photo screensaver.
#
# Out of the box this serves photos from the local ./photos directory and renders
# a weekly calendar from an example .ics feed. Edit the values below for your
# setup. Anything secret (e.g. an Immich API key) should go in a .env file next
# to this one rather than being committed — see the IMMICH_API_KEY note below.
#
# These services use the prebuilt images published to GHCR (`docker compose pull`
# to fetch them). To build from source instead, add a `build: ./backend` /
# `build: ./calrender` line to the respective service, or use the Makefile.

services:
  backend:
    image: ghcr.io/1800alex/rokuscreensaver-backend:latest
    container_name: rokuscreensaver-backend
    restart: unless-stopped
    ports:
      - "9543:9543"
    environment:
      # ---- common ----
      CALENDAR_PHOTO: /calendar/calendar.jpg   # local file, shown in either mode (leave unset to disable)
      CALENDAR_INTERVAL: "10"                  # show calendar after this many photos
      IMAGE_DURATION_SECONDS: "10"             # seconds each image is served
      PORT: "9543"
      WIDTH: "1920"                        # output resolution width (default "1920")
      HEIGHT: "1080"                       # output resolution height (default "1080")

      # ---- photo source: pick ONE ----
      # (A) Local directory mode — used when IMMICH_ALBUM_ID is empty/unset:
      PHOTO_DIR: /photos

      # (B) Immich album mode — active whenever IMMICH_ALBUM_ID is set.
      #     IMMICH_HOST is accepted as an alias for IMMICH_URL.
      #     Uncomment the three lines below to use it. Keep the API key OUT of git:
      #     put `IMMICH_API_KEY=...` in a .env file beside this compose file and the
      #     ${IMMICH_API_KEY} reference below will pick it up automatically.
      # IMMICH_HOST: "http://immich.lan:2283"
      # IMMICH_API_KEY: ${IMMICH_API_KEY}
      # IMMICH_ALBUM_ID: "00000000-0000-0000-0000-000000000000"
      # IMMICH_IMAGE_SIZE: original       # original (default) | preview | thumbnail
      # IMMICH_REFRESH_MINUTES: "1440"    # how often to re-fetch album IDs (default 24h)
      PREFETCH: 10                        # how many converted frames to keep ready in memory (default "1" = 1 prefetch, 0 = convert on demand)

      # ---- image processing ----
      # Blur-filling options for when the image doesn't match the screen aspect ratio (e.g. portrait photos on a landscape screen):
      BLUR_FILL: "on"                     # "on" to blur-fill empty space around portrait/landscape images (either "on" or "off", default "on")
      BLUR_SIGMA: "40"                    # blur sigma for blur-filling (default "25")
      BG_BRIGHTNESS: "95"                 # percentage brightness for blurred background (default "70", "100" for no dimming)

      # ---- batch pre-render + sync (optional) ----
      # BATCH=1 pre-renders the ENTIRE source into CACHE_DIR up front and serves
      # from there, re-syncing on the refresh schedule (render new, delete frames
      # whose source is gone). CACHE_DIR MUST differ from PHOTO_DIR — the server
      # refuses to start otherwise, so it can never prune your originals.
      BATCH: "on"                          # "1"/"on" to enable (default "0")
      CACHE_DIR: /cache                   # derived-frame cache (default "/cache")

    volumes:
      # ./photos is only needed in directory mode.
      # - ./photos:/photos:ro
      # The calendar image is generated by the `calrender` service into the shared
      # `calendar` volume; the backend only needs read access.
      - calendar:/calendar:ro
      # Writable cache for BATCH mode (safe to delete; it's regenerated):
      - cache:/cache
    depends_on:
      - calrender
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9543/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Fetches the .ics feed for the week starting today and renders it into a
  # TV-friendly schedule JPEG, written to the shared `calendar` volume (which the
  # backend serves as CALENDAR_PHOTO). Also serves it at http://host:9544/calendar.jpg.
  calrender:
    image: ghcr.io/1800alex/rokuscreensaver-calrender:latest
    container_name: rokuscreensaver-calrender
    restart: unless-stopped
    ports:
      - "9544:9544"
    environment:
      TZ: America/New_York                # window is "today" in this timezone
      WIDTH: "1920"                       # match the screen / backend resolution
      HEIGHT: "1080"
      DAYS: "7"                           # days in the window (start = today)
      TITLE: "This Week"
      OUTPUT_PATH: /out/calendar.jpg      # written into the shared `calendar` volume
      REFRESH_MINUTES: "60"               # re-fetch + re-render cadence
      # Weather in the header's top-right (current conditions from wttr.in):
      WEATHER: "on"                       # "1"/"on" to enable (default off)
      WEATHER_LOCATION: "New York"        # wttr.in location
      WEATHER_UNITS: F                    # F or C
      # CAL_URL_TEMPLATE: a Go text/template for your .ics feed URL. The example
      # below points at a calendar export endpoint; replace the host and feed
      # names with your own. Tokens: {{.Start}} {{.End}} (YYYY-MM-DD),
      # {{.StartYear}} {{.StartMonth}} {{.StartDay}} {{.EndYear}} {{.EndMonth}}
      # {{.EndDay}}, {{.TZ}}, {{.TZEnc}} (URL-encoded TZ).
      CAL_URL_TEMPLATE: "http://calendar.lan:8100/export/download?start={{.Start}}&end={{.End}}&tz={{.TZEnc}}"
    volumes:
      - calendar:/out                     # writes /out/calendar.jpg here
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9544/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  cache: {}
  calendar: {}
