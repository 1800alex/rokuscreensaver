name: release

# Builds and publishes release artifacts whenever a tag matching v* is pushed:
#   * backend image   -> ghcr.io/<owner>/rokuscreensaver-backend
#   * calrender image -> ghcr.io/<owner>/rokuscreensaver-calrender
#     (both multi-arch: linux/amd64 + linux/arm64 for Raspberry Pi)
#   * the sideloadable Roku channel -> screensaver.zip, attached to the Release
#
# Example: `git tag v1.0.0 && git push origin v1.0.0`
# Uses the built-in GITHUB_TOKEN — no secrets to configure.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release and upload the zip
  packages: write   # push images to GHCR

jobs:
  images:
    name: build & push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: calrender
            context: ./calrender
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rokuscreensaver-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  roku:
    name: build Roku zip & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build screensaver.zip
        run: |
          docker build -t rokuscreensaver-roku-builder ./roku
          mkdir -p dist
          docker run --rm \
            -v "$PWD/roku:/app:ro" \
            -v "$PWD/dist:/out" \
            rokuscreensaver-roku-builder

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/screensaver.zip
          generate_release_notes: true
